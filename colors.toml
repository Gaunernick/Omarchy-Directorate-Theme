# DIRECTORATE — retro-futurist corporate brutalism.
# 90% void; every bright colour carries exactly one meaning:
#   cyan = information · red = alarm · blue = the institution · green = live signal
mode = "dark"

accent = "#37a8c2"
selection = "#21515b"
muted = "#5c6360"

background = "#0b140f"   # phosphor black: dark CRT glass with a green cast
dark_background = "#0b0b0a"
darker_background = "#070707"
lighter_background = "#1d2123"

foreground = "#b0cbd0"
dark_foreground = "#5c6360"
light_foreground = "#cfdfe2"
bright_foreground = "#e7ecec"
cursor = "#6fd0e3"

red = "#d24646"
yellow = "#c2a35a"
orange = "#c8743f"
green = "#4fc98a"
cyan = "#37a8c2"
blue = "#3d7cf5"
magenta = "#e2aaaf"
brown = "#9d5b46"

bright_red = "#ee6a5f"
bright_yellow = "#e0c27a"
bright_green = "#7fe0aa"
bright_cyan = "#6fd0e3"
bright_blue = "#6f9dff"
bright_magenta = "#f2c8cb"

# Window frames: the operator's active station is lit in institutional blue, the rest of the
# floor recedes into concrete.
hyprland_active_border = "#0e62fe"
hyprland_inactive_border = "#2a2e30"
